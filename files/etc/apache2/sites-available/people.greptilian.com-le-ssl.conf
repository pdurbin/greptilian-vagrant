<IfModule mod_ssl.c>
<VirtualHost *:443>
ServerName people.greptilian.com

DocumentRoot /var/www/people.greptilian.com

<Directory /var/www/people.greptilian.com>
# to allow .htacccess.
AllowOverride All
</Directory>


SSLCertificateFile /etc/letsencrypt/live/api.greptilian.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/api.greptilian.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
