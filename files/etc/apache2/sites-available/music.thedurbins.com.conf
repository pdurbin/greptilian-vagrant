<VirtualHost *:80>
ServerName music.thedurbins.com
DocumentRoot /var/www/music.thedurbins.com

<Directory /var/www/music.thedurbins.com>
  Options +Indexes
</Directory>

RewriteEngine on
RewriteCond %{SERVER_NAME} =music.thedurbins.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
