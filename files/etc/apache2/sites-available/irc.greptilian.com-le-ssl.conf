<IfModule mod_ssl.c>
<VirtualHost *:443>
ServerName irc.greptilian.com

DocumentRoot /var/www/irc.greptilian.com


SSLCertificateFile /etc/letsencrypt/live/api.greptilian.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/api.greptilian.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
