<IfModule mod_ssl.c>
<VirtualHost *:443>
ServerName music.thedurbins.com
DocumentRoot /var/www/music.thedurbins.com

<Directory /var/www/music.thedurbins.com>
  Options +Indexes
</Directory>


SSLCertificateFile /etc/letsencrypt/live/api.greptilian.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/api.greptilian.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
