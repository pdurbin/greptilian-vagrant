<IfModule mod_ssl.c>
<VirtualHost *:443>
ServerName thedurbins.com
DocumentRoot /var/www/thedurbins.com

<Directory /var/www/thedurbins.com>
  Options +Indexes
</Directory>

Alias /static /var/www/static.thedurbins.com

<Directory /var/www/static.thedurbins.com>
  Options +Indexes +FollowSymLinks
</Directory>


SSLCertificateFile /etc/letsencrypt/live/api.greptilian.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/api.greptilian.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
