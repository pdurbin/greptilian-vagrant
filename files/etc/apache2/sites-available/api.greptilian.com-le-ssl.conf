<IfModule mod_ssl.c>
<VirtualHost *:443>
ServerName api.greptilian.com

DocumentRoot /var/www/api.greptilian.com
#Header set Access-Control-Allow-Origin "*"

#RewriteEngine On
# Front-controller (exclude static resources)
#RewriteRule ^index\.html$ - [L]
#RewriteCond %{REQUEST_URI} !^/(assets|css|img|js|modules|partials|vendor)/
#RewriteRule . index.html [L]

<Directory /var/www/api.greptilian.com>
# to allow .htacccess.
AllowOverride All
## The following was moved to .htaccess
#From https://gist.github.com/santthosh/7dabf08fa3859361ef1e
#RewriteEngine On
#RewriteBase /
#RewriteRule ^index\.html$ - [L]
#RewriteCond %{REQUEST_FILENAME} !-f
#RewriteCond %{REQUEST_FILENAME} !-d
#RewriteRule . /index.html [L]
</Directory>


SSLCertificateFile /etc/letsencrypt/live/api.greptilian.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/api.greptilian.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
