<VirtualHost *:80>
ServerName people.greptilian.com

DocumentRoot /var/www/people.greptilian.com

<Directory /var/www/people.greptilian.com>
# to allow .htacccess.
AllowOverride All
</Directory>

RewriteEngine on
RewriteCond %{SERVER_NAME} =people.greptilian.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
