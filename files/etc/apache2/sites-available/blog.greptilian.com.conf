<VirtualHost *:80>
ServerName blog.greptilian.com

DocumentRoot /var/www/blog.greptilian.com

Alias /annex /var/www/annex

<Directory /var/www/annex>
  Options +Indexes
</Directory>

RewriteEngine on
RewriteCond %{SERVER_NAME} =blog.greptilian.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
