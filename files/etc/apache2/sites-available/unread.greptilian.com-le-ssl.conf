<IfModule mod_ssl.c>
<VirtualHost *:443>
ServerName unread.greptilian.com

DocumentRoot /var/www/unread.greptilian.com
#DocumentRoot /var/www/wiki

#RewriteEngine On

# Front-controller (exclude static resources)
#RewriteRule ^index\.html$ - [L]
#RewriteCond %{REQUEST_URI} !^/(assets|css|img|js|modules|partials|vendor)/
#RewriteRule . index.html [L]
<Directory /var/www/unread.greptilian.com>
# to allow .htacccess.
AllowOverride All
</Directory>


SSLCertificateFile /etc/letsencrypt/live/api.greptilian.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/api.greptilian.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
