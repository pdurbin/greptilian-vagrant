<IfModule mod_ssl.c>
<VirtualHost *:443>
ServerName blog.greptilian.com

DocumentRoot /var/www/blog.greptilian.com

Alias /annex /var/www/annex

<Directory /var/www/annex>
  Options +Indexes
</Directory>


SSLCertificateFile /etc/letsencrypt/live/api.greptilian.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/api.greptilian.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
